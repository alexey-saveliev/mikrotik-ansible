# CCR2116 USW2F specific settings

# Чекалов Антон, [14.02.2026 11:57]
# USW2F Port 1 -> 2F.1-B-11 -> трансляция осн
# USW2F Port 2 -> 2F.1-B-12 -> трансляция резерв
# USW2F Port 3-> 2F.1-B-13 -> бытовая сеть

# Чекалов Антон, [14.02.2026 11:57]
# USW2F Port 4 -> U7PM44

bridge_port:
  - name: ether1
    comment: 2F.1-B-11 - Hall 1. Broadcast Main
    pvid: 10
  - name: ether2
    comment: 2F.1-B-12 - Hall 1. Broadcast Backup
    pvid: 11
  - name: ether3
    comment: 2F.1-B-13 - Hall 1. Pult common
    pvid: 50
    edge: yes
    loop-protect: on
  - name: ether4
    comment: Hall 1. Unifi U7PM44
    pvid: 10
    tagged: [11,20,30,40,50,60,70,80,90,100]
